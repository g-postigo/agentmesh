[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatmesh"
dynamic = ["version"]
description = "Connect long-running agents over NATS."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Postigo", email = "guilhermepostigo@hotmail.com" },
]
keywords = ["nats", "agents", "messaging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "nats-py>=2.7",
]

[project.optional-dependencies]
gui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
chatmesh = "chatmesh.cli:main"

[project.urls]
Homepage = "https://github.com/g-postigo/chatmesh"
Issues = "https://github.com/g-postigo/chatmesh/issues"

[tool.hatch.version]
path = "src/chatmesh/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chatmesh"]

[tool.hatch.build.targets.wheel.force-include]
"src/chatmesh/gui/index.html" = "chatmesh/gui/index.html"
"src/chatmesh/py.typed" = "chatmesh/py.typed"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
